        two_factor_enabled:
          type: "boolean"
        community_allowed:
          type: "boolean"
        created_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
        profile:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
    Profile:
      type: "object"
      additionalProperties: false
      required:
        - "display_name"
        - "professional"
      properties:
        display_name:
          type: "string"
        professional:
          oneOf:
            - $ref: "#/components/schemas/ProfessionalVerification"
            - type: "null"
    ProfileUpdate:
      type: "object"
      additionalProperties: false
      required:
        - "display_name"
      properties:
        display_name:
          type: "string"
          minLength: 3
          maxLength: 30
          pattern: "^[A-Za-z0-9 _.-]+$"
    ProfessionalClaim:
      type: "object"
      additionalProperties: false
      required:
        - "profession"
      properties:
        profession:
          type: "string"
          minLength: 2
          maxLength: 80
        specialty:
          type: "string"
          minLength: 2
          maxLength: 80
    ProfessionalVerification:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "profession"
        - "specialty"
        - "status"
        - "verified_at"
        - "created_at"
      properties:
        id:
          type: "string"
        profession:
          type: "string"
        specialty:
          type:
            - "string"
            - "null"
        status:
          $ref: "#/components/schemas/VerificationStatus"
        verified_at:
          type:
            - "string"
            - "null"
