components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT (EdDSA, <=15 min, claims sub/sid/iss/aud/iat/exp/jti); server-side session check on every request"
  parameters:
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      schema:
        type: "string"
        maxLength: 512
    IdempotencyKeyRequired:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "Per user intent; replay within 24 h returns the stored response with Idempotent-Replayed: true"
    IdempotencyKeyOptional:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        format: "uuid"
    SpaceId:
      name: "space_id"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/SpaceId"
    PostId:
      name: "post_id"
      in: "path"
      required: true
      schema:
        type: "string"
    CommentId:
      name: "comment_id"
      in: "path"
      required: true
      schema:
        type: "string"
    ReportId:
      name: "report_id"
      in: "path"
      required: true
      schema:
        type: "string"
    NotificationId:
      name: "notification_id"
      in: "path"
      required: true
      schema:
        type: "string"
    AccountId:
      name: "account_id"
      in: "path"
      required: true
      schema:
        type: "string"
        maxLength: 64
    VerificationId:
      name: "verification_id"
      in: "path"
      required: true
      schema:
        type: "string"
  headers:
    RetryAfter:
      description: "Seconds until retry is allowed"
      schema:
        type: "integer"
        minimum: 1
  responses:
    BadRequest:
      description: "validation_failed | invalid_code"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "token_expired (refresh once) | unauthenticated (sign in again)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "forbidden | community_not_allowed | account_restricted | account_suspended | mfa_enrollment_required | mfa_step_up_required | self_action_forbidden"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "not_found (missing, malformed id, or not visible to this viewer)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "conflict (details.reason)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "invalid_state (details.reason) | idempotency_key_reused"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "rate_limited; never reveals whether an account exists"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: "community_unavailable (Community DB down; /config unaffected)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: "object"
      additionalProperties: false
      required:
        - "error"
      properties:
        error:
          type: "object"
          additionalProperties: false
          required:
            - "code"
            - "message"
            - "request_id"
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: "string"
            request_id:
              type: "string"
            details:
              type: "object"
              additionalProperties: true
              properties:
                field:
                  type: "string"
                rule:
                  type: "string"
                  enum:
                    - "required"
                    - "type"
                    - "min_length"
                    - "max_length"
                    - "pattern"
                    - "enum"
                    - "format"
                    - "unknown_field"
                    - "prohibited_key"
                    - "not_allowed_value"
                reason:
                  type: "string"
                retry_after_seconds:
                  type: "integer"
                until:
                  type:
                    - "string"
                    - "null"
                  format: "date-time"
    ErrorCode:
      type: "string"
      enum:
        - "validation_failed"
        - "invalid_code"
        - "token_expired"
        - "unauthenticated"
        - "forbidden"
        - "community_not_allowed"
        - "account_restricted"
        - "account_suspended"
        - "mfa_enrollment_required"
        - "mfa_step_up_required"
        - "self_action_forbidden"
        - "not_found"
        - "conflict"
        - "invalid_state"
        - "idempotency_key_reused"
        - "rate_limited"
        - "internal_error"
        - "community_unavailable"
    CommunityMode:
      type: "string"
      enum:
        - "disabled"
        - "internal"
        - "closed_beta"
        - "public"
    SpaceId:
      type: "string"
      enum:
        - "general_health"
        - "pregnancy_maternal"
    DisplayMode:
      type: "string"
      enum:
        - "named"
        - "pseudonymous"
    ModContentStatus:
      type: "string"
      enum:
        - "visible"
        - "hidden"
        - "removed"
        - "deleted_by_author"
        - "tombstoned"
    Role:
      type: "string"
      enum:
        - "member"
        - "moderator"
        - "admin"
    AccountStatus:
      type: "string"
      enum:
        - "active"
        - "restricted"
        - "suspended"
    VerificationStatus:
      type: "string"
      enum:
        - "pending"
        - "verified"
        - "revoked"
    ReportTargetType:
      type: "string"
      enum:
        - "post"
        - "comment"
    ReportReason:
      type: "string"
      enum:
        - "spam"
        - "harassment"
        - "misinformation"
        - "unsafe_medical_advice"
        - "self_harm_or_emergency"
        - "personal_information"
        - "other"
    ReportStatus:
      type: "string"
      enum:
        - "open"
        - "actioned"
        - "dismissed"
    NotificationType:
      type: "string"
      enum:
        - "reply_to_post"
        - "comment_reply"
        - "moderation_notice"
    ModerationNotice:
      type: "string"
      enum:
        - "content_hidden"
        - "content_removed"
        - "content_restored"
        - "account_restricted"
        - "account_suspended"
        - "account_reinstated"
        - "verification_updated"
    ModerationActionType:
      type: "string"
      enum:
        - "dismiss_report"
        - "reveal_identity"
        - "hide_content"
        - "restore_content"
        - "remove_content"
        - "restrict_account"
        - "suspend_account"
        - "reinstate_account"
        - "change_role"
        - "reset_totp"
        - "verify_professional"
        - "revoke_professional"
        - "withdraw_professional"
        - "delete_account"
    ModerationTargetType:
      type: "string"
      enum:
        - "post"
        - "comment"
        - "account"
        - "report"
        - "professional_verification"
    Features:
      type: "object"
      additionalProperties: false
      required:
        - "community"
        - "community_allowed"
      properties:
        community:
          $ref: "#/components/schemas/CommunityMode"
        community_allowed:
          type: "boolean"
    OtpRequest:
      type: "object"
      additionalProperties: false
      required:
        - "email"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
    OtpVerify:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "code"
        - "device_id"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
        code:
          type: "string"
          pattern: "^[0-9]{6}$"
        device_id:
          type: "string"
          format: "uuid"
        device_label:
          type: "string"
          minLength: 1
          maxLength: 64
    RefreshRequest:
      type: "object"
      additionalProperties: false
      required:
        - "refresh_token"
        - "device_id"
      properties:
        refresh_token:
          type: "string"
          pattern: "^wprt_[A-Za-z0-9_-]{43,}$"
        device_id:
          type: "string"
          format: "uuid"
    LogoutRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        refresh_token:
          type: "string"
    TokenPair:
      type: "object"
      additionalProperties: false
      required:
        - "token_type"
        - "access_token"
        - "expires_in"
        - "access_token_expires_at"
        - "refresh_token"
        - "refresh_token_expires_at"
        - "account_created"
        - "account"
      properties:
        token_type:
          const: "Bearer"
        access_token:
          type: "string"
        expires_in:
          type: "integer"
          maximum: 900
        access_token_expires_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
        refresh_token:
          type: "string"
        refresh_token_expires_at:
          type: "string"
          format: "date-time"
          description: "Family absolute expiry; idle limit (7 d member / 1 h privileged) may end it sooner"
        account_created:
          type: "boolean"
        account:
          $ref: "#/components/schemas/Me"
    Session:
      type: "object"
      additionalProperties: false
      required:
        - "session_id"
        - "device_label"
        - "created_at"
        - "last_used_at"
        - "expires_at"
        - "current"
      properties:
        session_id:
          type: "string"
          format: "uuid"
        device_label:
          type:
            - "string"
            - "null"
        created_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
        last_used_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
        expires_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
        current:
          type: "boolean"
    TotpEnrolment:
      type: "object"
      additionalProperties: false
      required:
        - "otpauth_uri"
        - "secret_base32"
        - "digits"
        - "period"
      properties:
        otpauth_uri:
          type: "string"
        secret_base32:
          type: "string"
        digits:
          const: 6
        period:
          const: 30
    TotpCode:
      type: "object"
      additionalProperties: false
      required:
        - "code"
      properties:
        code:
          type: "string"
          pattern: "^[0-9]{6}$"
    TotpStepUp:
      oneOf:
        - type: "object"
          additionalProperties: false
          required:
            - "code"
          properties:
            code:
              type: "string"
              pattern: "^[0-9]{6}$"
        - type: "object"
          additionalProperties: false
          required:
            - "backup_code"
          properties:
            backup_code:
              type: "string"
              minLength: 8
              maxLength: 32
    StepUpResult:
      type: "object"
      additionalProperties: false
      required:
        - "step_up"
        - "step_up_expires_at"
      properties:
        step_up:
          const: "verified"
        step_up_expires_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
    Me:
      type: "object"
      additionalProperties: false
      required:
        - "account_id"
        - "email"
        - "role"
        - "status"
        - "restricted_until"
        - "two_factor_enabled"
        - "community_allowed"
        - "created_at"
        - "profile"
      properties:
        account_id:
          type: "string"
        email:
          type: "string"
        role:
