# WellaPath Community API v1.0-draft (CANONICAL, pending founder sign-off). Must stay consistent with COMMUNITY_API_CONTRACT.md (markdown wins). Change only via PR to both files.
openapi: "3.1.0"
info:
  title: "WellaPath Community API"
  version: "1.0.0-draft"
  description: "CANONICAL v1.0-draft, pending founder sign-off. Machine-readable companion to WELLAPATH_ENGINEERING/COMMUNITY_API_CONTRACT.md; on conflict the markdown wins. Governed by ADR-001 incl. amendments A1-A4. Every request body rejects unknown keys (400 unknown_field) and prohibited assessment keys (400 prohibited_key). All responses carry Cache-Control: no-store and X-Request-Id. Vendor extensions: x-wellapath-role, x-wellapath-2fa (TOTP enrolled + fresh per-session step-up), x-wellapath-rate-limit, x-wellapath-audit."
  contact:
    name: "WellaPath engineering lead (API architect)"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-WellaPath-Proprietary"
servers:
  - url: "/"
    description: "Same origin as the wellapath-backend service (Render, Frankfurt). Community routes exist only when COMMUNITY_MODE is enabled."
tags:
  - name: "features"
    description: "GET /v1/features: the only route registered when COMMUNITY_MODE=disabled"
  - name: "auth"
    description: "WellaPath-owned facade over Better Auth (raw Better Auth HTTP routes are not exposed). Rotating refresh tokens with reuse detection (ADR A2)"
  - name: "self"
    description: "Own account, profile, professional claim, data export and deletion"
  - name: "content"
    description: "Spaces, text posts, single-level comments (member DTOs never carry an author account id)"
  - name: "reports"
    description: "Reporting posts and comments"
  - name: "notifications"
    description: "In-app notification centre (polling)"
  - name: "moderation"
    description: "Moderator routes: role >= moderator, TOTP enrolled, fresh step-up; every mutation audited with a reason"
  - name: "admin"
    description: "Admin-only routes: roles, TOTP reset, professional verification"
paths:
  "/v1/features":
    get:
      operationId: "getFeatures"
      summary: "Community flag for this viewer (fail closed; always 200)"
      tags:
        - "features"
      security:
        - {}
        - bearerAuth: []
      x-wellapath-role: "none (token optional)"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "60/min per trusted IP [interim global 6000/min]"
      x-wellapath-audit: "none"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Features"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/v1/auth/otp/request":
    post:
      operationId: "requestOtp"
      summary: "Request email OTP (sign-up or sign-in). Always 202."
      tags:
        - "auth"
      security: []
      x-wellapath-role: "none"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "per normalised email 3/15min and 10/24h; per IP 20/h [interim global 600/h]"
      x-wellapath-audit: "auth_events otp_requested (email_hmac)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: "Accepted (identical for unknown/existing/suspended emails)"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: []
                properties: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/otp/verify":
    post:
      operationId: "verifyOtp"
      summary: "Verify OTP; creates account if new; issues tokens"
      tags:
        - "auth"
      security: []
      x-wellapath-role: "none"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "5 attempts per code then invalidated; per email 20/h; per IP 60/h [interim global 1200/h]"
      x-wellapath-audit: "auth_events sign_in_succeeded|sign_in_failed, family_created"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/refresh":
    post:
      operationId: "refreshTokens"
      summary: "Rotate refresh token (single use; reuse revokes family)"
      tags:
        - "auth"
      security: []
      x-wellapath-role: "none"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "per family 10/min; per IP 120/min [interim global 3000/min]"
      x-wellapath-audit: "auth_events refresh_rotated|refresh_reuse_detected|family_revoked"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/logout":
    post:
      operationId: "logout"
      summary: "Revoke this device's family and session (idempotent)"
      tags:
        - "auth"
      security:
        - bearerAuth: []
      x-wellapath-role: "any"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "30/min per account"
      x-wellapath-audit: "auth_events logout"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/sessions":
    get:
      operationId: "listSessions"
      summary: "List my signed-in devices"
      tags:
        - "auth"
      security:
        - bearerAuth: []
      x-wellapath-role: "any"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "30/min per account"
      x-wellapath-audit: "none"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required:
                  - "items"
                  - "next_cursor"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Session"
                  next_cursor:
                    type:
                      - "string"
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/sessions/revoke-others":
    post:
      operationId: "revokeOtherSessions"
      summary: "Recovery: revoke every other device"
      tags:
        - "auth"
      security:
        - bearerAuth: []
      x-wellapath-role: "any"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "30/min per account"
      x-wellapath-audit: "auth_events sessions_revoked_by_user"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: []
              properties: {}
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required:
                  - "revoked"
                properties:
                  revoked:
                    type: "integer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/totp/enrol":
    post:
      operationId: "startTotpEnrolment"
      summary: "Start TOTP enrolment (privileged roles)"
      tags:
        - "auth"
      security:
        - bearerAuth: []
      x-wellapath-role: "moderator"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "5/h per account"
      x-wellapath-audit: "auth_events totp_enrol_started"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: []
              properties: {}
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TotpEnrolment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/totp/enrol/confirm":
    post:
      operationId: "confirmTotpEnrolment"
      summary: "Confirm TOTP; returns 10 single-use backup codes once; counts as step-up"
      tags:
        - "auth"
      security:
        - bearerAuth: []
      x-wellapath-role: "moderator"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "5 consecutive failures => session revoked + 15 min lockout; 20/h"
      x-wellapath-audit: "auth_events totp_enrolled"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required:
                  - "backup_codes"
                  - "step_up_expires_at"
                properties:
                  backup_codes:
                    type: "array"
                    minItems: 10
                    maxItems: 10
                    items:
                      type: "string"
                  step_up_expires_at:
                    type: "string"
                    format: "date-time"
                    description: "RFC 3339 UTC (Z), server clock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/totp/verify":
    post:
      operationId: "stepUpTotp"
      summary: "Per-session TOTP step-up (code or backup code)"
      tags:
        - "auth"
      security:
        - bearerAuth: []
      x-wellapath-role: "moderator"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "5 consecutive failures => session revoked + 15 min account lockout (429); 20/h"
      x-wellapath-audit: "auth_events step_up_succeeded|step_up_failed|totp_lockout"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TotpStepUp"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/StepUpResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/me":
    get:
      operationId: "getMe"
      summary: "Own account (not allowlist-gated)"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "any"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "default 120/min per account"
      x-wellapath-audit: "none"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/me/profile":
    get:
      operationId: "getProfile"
      summary: "Own profile (404 until created)"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "default 120/min per account"
      x-wellapath-audit: "none"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: "putProfile"
      summary: "Create/update display name"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "10/h per account"
      x-wellapath-audit: "none"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/me/professional-claim":
    get:
      operationId: "getProfessionalClaim"
      summary: "Own professional claim"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "default 120/min per account"
      x-wellapath-audit: "none"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ProfessionalVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: "claimProfession"
      summary: "Claim a profession; always pending. No status field accepted."
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "3/24h per account"
      x-wellapath-audit: "none"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ProfessionalClaim"
      responses:
        "201":
          description: "Created (status pending)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ProfessionalVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "withdrawProfessionalClaim"
      summary: "Withdraw claim / remove badge"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "default 120/min per account"
      x-wellapath-audit: "moderation_actions withdraw_professional (actor = self)"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/me/export":
    get:
      operationId: "exportMyData"
      summary: "NDPA data export (not allowlist-gated)"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "any"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "3/24h per account"
      x-wellapath-audit: "auth_events data_exported"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/me/delete":
    post:
      operationId: "deleteMyAccount"
      summary: "NDPA account deletion (PII erased, content tombstoned, evidence retained)"
      tags:
        - "self"
      security:
        - bearerAuth: []
      x-wellapath-role: "member (privileged must be demoted first)"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "3/24h per account"
      x-wellapath-audit: "moderation_actions delete_account + auth_events account_deleted"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DeleteAccount"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/spaces":
    get:
      operationId: "listSpaces"
      summary: "Exactly the two seeded spaces"
      tags:
        - "content"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "default 120/min per account"
      x-wellapath-audit: "none"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required:
                  - "items"
                properties:
                  items:
                    type: "array"
                    minItems: 2
                    maxItems: 2
                    items:
                      $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/community/spaces/{space_id}/posts":
    get:
      operationId: "listPosts"
      summary: "Visible posts, newest first"
      tags:
        - "content"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "default 120/min per account"
      x-wellapath-audit: "none"
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: "createPost"
      summary: "Create text post (profile required; not restricted)"
      tags:
        - "content"
      security:
        - bearerAuth: []
      x-wellapath-role: "member"
      x-wellapath-2fa: false
      x-wellapath-rate-limit: "5/h and 20/24h per account"
      x-wellapath-audit: "none"
