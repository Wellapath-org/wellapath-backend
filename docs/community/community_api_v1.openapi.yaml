          description: "Non-null iff status == verified"
        created_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
    DeleteAccount:
      type: "object"
      additionalProperties: false
      required:
        - "confirm"
      properties:
        confirm:
          const: "DELETE MY ACCOUNT"
    Export:
      type: "object"
      additionalProperties: true
      required:
        - "format"
        - "version"
        - "exported_at"
        - "account"
        - "profile"
        - "professional_verifications"
        - "posts"
        - "comments"
        - "reports_filed"
        - "notifications"
        - "sessions"
        - "restrictions"
      properties:
        format:
          const: "wellapath-community-export"
        version:
          const: 1
        exported_at:
          type: "string"
          format: "date-time"
          description: "RFC 3339 UTC (Z), server clock"
        account:
          type: "object"
        profile:
          type:
            - "object"
            - "null"
        professional_verifications:
          type: "array"
          items:
            type: "object"
        posts:
          type: "array"
          items:
            type: "object"
        comments:
          type: "array"
          items:
            type: "object"
        reports_filed:
          type: "array"
          items:
            type: "object"
        notifications:
          type: "array"
          items:
            type: "object"
        sessions:
          type: "array"
          items:
            type: "object"
        restrictions:
          type: "array"
          items:
