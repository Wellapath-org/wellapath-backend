name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript build check
        run: npx tsc --noEmit --skipLibCheck

      - name: Verify telemetry contract artifacts are in sync
        run: npm run telemetry:contract:check

      - name: Run tests
        run: npm test

  community-poc:
    # Community auth/data PROOF OF CONCEPT (ADR-001). Runs the Community database suites against
    # a throwaway Postgres service container. No secrets: the database and roles exist only for
    # the life of this job, and every auth secret is generated inside the tests.
    # PostgreSQL 18 to match the Neon server major version (ADR-001 B1). The owner role has
    # CREATEROLE like Neon's owner; community_app mirrors what provision-runtime-role creates.
    name: Community (Postgres 18, contract suites)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-throwaway
      COMMUNITY_TEST_DATABASE_URL: postgres://community_owner:ci-owner@127.0.0.1:5432/wellapath_community_test
      COMMUNITY_TEST_APP_DATABASE_URL: postgres://community_app:ci-app@127.0.0.1:5432/wellapath_community_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Create throwaway roles and database
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE community_owner LOGIN CREATEROLE PASSWORD 'ci-owner'"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE community_app LOGIN NOINHERIT PASSWORD 'ci-app'"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE wellapath_community_test OWNER community_owner"
      - name: Install pg_dump 18 (must match the server major version, ADR-001 B1)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - name: Run Community suites
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/18/bin/pg_dump
        run: npm run test:community
      # B2: the provisioning script itself, run as the owner against the migrated test database.
      # community_app already exists here, so no password is generated; --verify fails the job on
      # any deviation from the privilege matrix.
      - name: Provision and verify the runtime role (B2)
        run: |
          COMMUNITY_DATABASE_URL_DIRECT=postgres://community_owner:ci-owner@127.0.0.1:5432/wellapath_community_test \
            npm run community:migrate -- up
          COMMUNITY_DATABASE_URL_DIRECT=postgres://community_owner:ci-owner@127.0.0.1:5432/wellapath_community_test \
            npm run community:provision-runtime-role -- --verify
      # A4 readiness script, exercised against this job's LOCAL Postgres (not Neon: no WellaPath
      # Neon organisation exists yet). Proves the script itself works; it is not Neon evidence.
      - name: Neon connectivity PoC script (local Postgres only)
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE wellapath_neon_poc_branch OWNER community_owner"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE wellapath_restore_check OWNER community_owner"
          COMMUNITY_DATABASE_URL=postgres://community_app:ci-app@127.0.0.1:5432/wellapath_neon_poc_branch \
          COMMUNITY_DATABASE_URL_DIRECT=postgres://community_owner:ci-owner@127.0.0.1:5432/wellapath_neon_poc_branch \
          COMMUNITY_RESTORE_CHECK_URL=postgres://community_owner:ci-owner@127.0.0.1:5432/wellapath_restore_check \
          NEON_POC_CONFIRM_BRANCH=yes PG_BIN=/usr/lib/postgresql/18/bin \
            npm run community:neon-poc -- --runs 10 --out neon-connectivity-report.md
          cat neon-connectivity-report.md >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM (CycloneDX, production dependencies)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SOUP / SBOM evidence (REGULATORY_ENGINEERING_READINESS §3 item 4). Lists the
      # production dependency tree from package-lock.json; dev dependencies are omitted.
      # The generator is pinned and run through npx so it is not a project dependency.
      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
            --omit dev \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          node -e "const b=require('./sbom.cdx.json'); if (b.bomFormat!=='CycloneDX'||!Array.isArray(b.components)||b.components.length===0) { console.error('SBOM is empty or malformed'); process.exit(1); } console.log('CycloneDX ' + b.specVersion + ': ' + b.components.length + ' components');"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
