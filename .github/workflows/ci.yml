name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript build check
        run: npx tsc --noEmit --skipLibCheck

      - name: Verify telemetry contract artifacts are in sync
        run: npm run telemetry:contract:check

      - name: Run tests
        run: npm test

  community-poc:
    # Community auth/data PROOF OF CONCEPT (ADR-001). Runs the Community database suites against
    # a throwaway Postgres service container. No secrets: the database and roles exist only for
    # the life of this job, and every auth secret is generated inside the tests.
    name: Community PoC (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-throwaway
      COMMUNITY_TEST_DATABASE_URL: postgres://community_owner:ci-owner@127.0.0.1:5432/wellapath_community_test
      COMMUNITY_TEST_APP_DATABASE_URL: postgres://community_app:ci-app@127.0.0.1:5432/wellapath_community_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Create throwaway roles and database
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE community_owner LOGIN PASSWORD 'ci-owner'"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE community_app LOGIN PASSWORD 'ci-app'"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE wellapath_community_test OWNER community_owner"
      - name: Install pg_dump 17 (must match the server major version)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Run Community suites
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
        run: npm run test:community
